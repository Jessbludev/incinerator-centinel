[package]
name = "incinerator-sentinel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
description = "Zero-trust sentinel for critical services"
readme = "README.md"
repository = "https://example.invalid/incinerator-sentinel"
keywords = ["security", "sentinel", "zero-trust", "linux", "hardened"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["hardened", "landlock", "seccomp", "volatile-audit"]
hardened = []
landlock = []
seccomp = []
volatile-audit = []
telemetry = []
debug-output = []
zk = []
tpm = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
blake3 = "1.5"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.13"

[[test]]
name = "base_cli"
path = "tests/integration/base_cli.rs"
