[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "openssl"
reason = "Evitar dependencia de OpenSSL; usar criptografia Rust auditada."
